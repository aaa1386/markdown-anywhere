name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    name: Companion tests and Windows build
    runs-on: windows-latest

    defaults:
      run:
        working-directory: companion

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: companion/go.mod
          cache: false

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Windows EXE
        run: |
          New-Item -ItemType Directory -Force dist
          go build -buildvcs=false -ldflags="-H=windowsgui" -o dist/MarkownAnywhere-VaultPath.exe ./cmd/markown-anywhere

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarkownAnywhere-VaultPath
          path: companion/dist/MarkownAnywhere-VaultPath.exe

  plugin:
    name: Plugin build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build
